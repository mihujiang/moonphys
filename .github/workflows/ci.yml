name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> $GITHUB_PATH

      - name: Print toolchain version
        run: moon version --all

      - name: Check
        shell: bash
        run: |
          set -o pipefail
          moon check --deny-warn 2>&1 | tee check.log || status=$?
          if [ -n "$status" ]; then
            # Surface the compiler diagnostics as annotations so they are
            # readable through the checks API (job logs need authentication).
            grep -iE "warning|error" check.log | head -n 40 | while IFS= read -r line; do
              echo "::error::${line//%/%25}"
            done
            exit 1
          fi

      - name: Format
        run: moon fmt --check

      - name: Test
        run: moon test

      - name: Test on JavaScript target
        run: moon test --target js

      - name: Build the demo generator
        run: moon build cmd/main --target js
